---
- name: Create etcd system group
  ansible.builtin.group:
    name: etcd
    system: true

- name: Create etcd system user
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download etcd release archive
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    checksum: "{{ etcd_checksum }}"
    mode: "0644"

- name: Extract etcd release archive
  ansible.builtin.unarchive:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/etcd"

- name: Install etcd, etcdctl and etcdutl binaries
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - etcd
    - etcdctl
    - etcdutl

- name: Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Create etcd backup directory
  ansible.builtin.file:
    path: "{{ etcd_backup_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Install etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: Restart etcd

- name: Install etcd snapshot and defrag systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - etcd-snapshot.service
    - etcd-snapshot.timer
    - etcd-defrag.service
    - etcd-defrag.timer

- name: Start and enable etcd
  ansible.builtin.systemd_service:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true

- name: Start and enable etcd snapshot and defrag timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - etcd-snapshot.timer
    - etcd-defrag.timer
