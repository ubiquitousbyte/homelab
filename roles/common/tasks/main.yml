---
- name: Bring up the private network interface
  ansible.builtin.import_tasks: private_network.yml
- name: Harden SSH access
  ansible.builtin.import_tasks: sshd.yml
- name: Set up automatic security updates
  ansible.builtin.import_tasks: unattended-upgrades.yml
- name: Set up Ghostty terminal support
  ansible.builtin.import_tasks: ghostty.yml
- name: Set up Python and pip
  ansible.builtin.import_tasks: python.yml
- name: Set up Docker and container registry access
  ansible.builtin.import_tasks: docker.yml
